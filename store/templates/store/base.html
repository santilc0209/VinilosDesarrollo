<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PoliSongStock{% endblock %}</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        header { background: #781e95; color: #fff; padding: 10px; }
        a { text-decoration: none; color: #781e95; }
        table { width: 100%; background: white; border-collapse: collapse; margin-top: 20px; }
        table th, table td { padding: 10px; border: 1px solid #ccc; }
        .btn { padding: 8px 12px; background: #781e95; color: white; border-radius: 5px; }
        .btn-danger { background: red; }
        .btn-secondary { background: #555; }
        form { background: white; padding: 15px; border-radius: 6px; width: 400px; }
    </style>
</head>
<body>
    <header>
        <h2>🎵 PoliSongStock - Gestión de Vinilos</h2>
    </header>

    {% block content %}
    {% endblock %}
</body>
</html>
